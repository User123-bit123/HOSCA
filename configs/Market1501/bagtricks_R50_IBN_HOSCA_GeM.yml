_BASE_: "./bagtricks_R50.yml"

MODEL:
  BACKBONE:
    NAME: "build_resnet_hierarchical_backbone"  # 使用支持多层级特征的 Backbone
    WITH_IBN: True
    WITH_HOSCA: True  # 启用跨层 OS-CA (Layer3 + Layer4 融合)
    FEAT_DIM: 2048
    PRETRAIN: True
    PRETRAIN_PATH: ""
  HEADS:
    POOL_LAYER: "GeneralizedMeanPoolingP"  # GeM 池化
    NECK_FEAT: "before"
    WITH_BNNECK: True
  LOSSES:
    NAME: ("CrossEntropyLoss", "TripletLoss")
    CE:
      EPSILON: 0.1
      SCALE: 1.0
    TRI:
      MARGIN: 0.3
      HARD_MINING: True
      NORM_FEAT: True  # 开启特征归一化，显著提升 mAP
      SCALE: 1.0

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  FLIP:
    ENABLED: True
    PROB: 0.5
  PADDING:
    ENABLED: True
    SIZE: 10

SOLVER:
  MAX_EPOCH: 120
  BASE_LR: 3.5e-4
  IMS_PER_BATCH: 64
  SCHED: "MultiStepLR"
  STEPS: [40, 70]
  GAMMA: 0.1
  WARMUP_ITERS: 2000
  CHECKPOINT_PERIOD: 20

TEST:
  EVAL_PERIOD: 20
  IMS_PER_BATCH: 128
  FLIP:
    ENABLED: False  # 关闭 TTA，验证模型硬实力
  # 不使用 Re-ranking，验证模型本身能力
  RERANK:
    ENABLED: False

OUTPUT_DIR: "logs/Market1501/bagtricks_R50_IBN_HOSCA_GeM_v8_map_opt"
