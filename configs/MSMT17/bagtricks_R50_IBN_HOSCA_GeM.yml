_BASE_: "../Base-bagtricks.yml"

MODEL:
  BACKBONE:
    NAME: "build_resnet_hierarchical_backbone"
    WITH_IBN: True
    WITH_HOSCA: True
    FEAT_DIM: 2048
    PRETRAIN: True
    PRETRAIN_PATH: ""
  HEADS:
    POOL_LAYER: "GeneralizedMeanPoolingP"
    NECK_FEAT: "before"
    WITH_BNNECK: True
  LOSSES:
    NAME: ("CrossEntropyLoss", "TripletLoss")
    CE:
      EPSILON: 0.1
      SCALE: 1.0
    TRI:
      MARGIN: 0.3
      HARD_MINING: True
      NORM_FEAT: True
      SCALE: 1.0

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  FLIP:
    ENABLED: True
    PROB: 0.5
  PADDING:
    ENABLED: True
    SIZE: 10

DATASETS:
  NAMES: ("MSMT17",)
  TESTS: ("MSMT17",)

SOLVER:
  MAX_EPOCH: 120
  BASE_LR: 3.5e-4
  IMS_PER_BATCH: 64
  SCHED: "MultiStepLR"
  STEPS: [40, 70]
  GAMMA: 0.1
  WARMUP_ITERS: 2000
  CHECKPOINT_PERIOD: 20

TEST:
  EVAL_PERIOD: 20
  IMS_PER_BATCH: 128
  FLIP:
    ENABLED: False
  RERANK:
    ENABLED: False

OUTPUT_DIR: "logs/MSMT17/bagtricks_R50_IBN_HOSCA_GeM"
